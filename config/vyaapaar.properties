# Airpay Vyaapaar (merchant) Android app — package on the device build 3.0.20-staging-accessibility
vyaapaar.app.name=airpay vyaapaar
vyaapaar.app.package=com.airpay.mahaepay_aeps
vyaapaar.app.activity=com.airpay.mahaepay_aeps.MainActivity

# Keep the logged-in session. Never pm-clear this app, and never relaunch it
# into the background — that asks for fingerprint, face, or PIN.
vyaapaar.fresh.start=false
android.autoLaunch=false
android.keep.session=true
mobile.platform=android
android.noReset=true
android.fullReset=false
android.newCommandTimeout=14400

vyaapaar.test.mobile=7906862513
# Merchant username for the username/password login. The password itself lives
# only in config/secrets.properties (git-ignored), never in a committed file.
vyaapaar.test.username=M101319
vyaapaar.test.name=Shubham Verma
vyaapaar.test.email=shubham.verma.inform@gmail.com
vyaapaar.test.pan=AQIPV5654R
vyaapaar.test.city=Saharanpur
vyaapaar.test.state=Uttar Pradesh
vyaapaar.test.pin=247001
# Staging login OTP. Used only when the app asks for one after username/password login.
vyaapaar.test.otp=123456
# Username/password login runs only after the accessibility scan, from @password-login.
# vyaapaar.test.password=

# One pass over every reachable screen. Finished screens are remembered under target/vyaapaar/session.
a11y.enabled=true
a11y.deep.scan=true
a11y.deep.max.screens=800
a11y.crawl.exhaustive=true
a11y.crawl.max.depth=8
a11y.crawl.max.clicks.per.screen=40
a11y.crawl.branch.budget.ms=10800000
a11y.crawl.stop.before.submit=true
# Fewer scroll retries when hunting a control — home modules skip scroll-to-top when already visible.
a11y.info.scroll.swipes=3
a11y.gate.strict=false
