# Runtime switch — override with -Denv=live|staging
env=live
airpay.product=capital
mobile.platform=android

# Appium server (start separately: appium)
appium.server.url=http://127.0.0.1:4723

# Physical device (blank = first connected)
android.udid=RZCW724DGXZ
android.automationName=UiAutomator2
android.noReset=true
android.fullReset=false
android.autoGrantPermissions=true
android.newCommandTimeout=600

timeout.action=20000
timeout.navigation=60000
timeout.otp.wait.ms=120000

report.screenshot.dir=screenshots/failures
airpay.log.dir=logs

# Accessibility (native Android tree — same report style as web axe scorecards)
a11y.enabled=true
a11y.deep.scan=true
a11y.deep.max.screens=200
a11y.crawl.max.depth=12
a11y.crawl.max.forward.steps=12
a11y.crawl.branch.budget.ms=180000
a11y.crawl.stop.before.submit=true
a11y.info.scroll.swipes=8
a11y.fail.on=critical,serious
a11y.report.dir=accessibility_testing_result
a11y.min.touch.dp=48
