capital.app.activity=com.example.airpay_capital.MainActivity
capital.app.apk.path=C:/Users/shubham.verma/Downloads/airapy-capital.apk

# Login — real device SMS OTP (leave capital.test.otp blank to read from notifications)
capital.test.mobile=8802729089
capital.test.otp=
timeout.otp.wait.ms=120000

# Scenario-specific mobiles (placeholders — set in secrets.properties when available)
# capital.test.mobile.withOffers=
# capital.test.mobile.noOffer=
# capital.test.mobile.lowCibil=
capital.cibil.low.message=CIBIL

# Platform: android | ios (@iOSXCUITFindBy placeholders on screen classes)
mobile.platform=android
capital.fresh.start=false
android.keep.session=true

# Deep crawl — every loan + Info; abort immediately on HTTP 500
a11y.deep.scan=true
a11y.deep.max.screens=200
a11y.crawl.max.depth=12
a11y.crawl.max.forward.steps=12
a11y.crawl.branch.budget.ms=180000
a11y.crawl.include.home.loan=true
a11y.crawl.stop.before.submit=true
a11y.info.scroll.swipes=8
