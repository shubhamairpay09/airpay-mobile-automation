# Keep the logged-in app on screen for the whole run. Do not relaunch between cases.
android.keep.session=true
# Cap hung UiAutomator reads so a single case cannot sit on getCurrentPackage for minutes.
android.uiautomator2ServerReadTimeoutMs=20000

# Long exhaustive crawls (tabs + nested modules + every control)
android.newCommandTimeout=14400

# Deep a11y crawl — click every button/link/image and recurse into sub-screens
a11y.enabled=true
a11y.deep.scan=true
a11y.deep.max.screens=2000
a11y.crawl.exhaustive=true
a11y.crawl.max.depth=12
a11y.crawl.max.forward.steps=12
a11y.crawl.max.clicks.per.screen=40
a11y.crawl.branch.budget.ms=300000
a11y.crawl.stop.before.submit=true
a11y.crawl.info=true
a11y.info.scroll.swipes=4
a11y.gate.strict=false
